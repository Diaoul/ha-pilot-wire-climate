[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", "testing_config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
fail_under = 99

[tool.mypy]
strict = true
files = ["custom_components"]
# Home Assistant's own modules reexport names without __all__.
implicit_reexport = true

[tool.ruff.lint]
extend-select = ["G", "PT", "T20"]
# Home Assistant's entity and flow class attributes are mutable lists and dicts.
extend-ignore = ["RUF012"]

# Core's import style, so code ported from core helpers keeps its imports.
[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

name: CI

on:
  push:
    # Renovate merges its branches once their checks pass, without a pull request.
    branches: [main, "renovate/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run setup
      - run: mise run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run setup
      - run: mise run lint

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  release:
    needs: [test, lint, hassfest, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, create the release and upload its zip
      issues: write # label the release pull request
      pull-requests: write # open and update the release pull request
    steps:
      # The release is a draft until its zip is attached: HACS installs the zip
      # and would fail on a published release without one.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keyed on the draft rather than on release_created, so that a rerun or
      # the next push finishes a release whose upload failed.
      - name: Attach the zip to a draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          draft=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" != true ]; then
            echo "No draft release for $version"
            exit 0
          fi
          git fetch --quiet --depth 1 origin tag "$version"
          git checkout --quiet "refs/tags/$version"
          cd custom_components/pilot_wire_climate
          zip -r pilot_wire_climate.zip .
          gh release upload "$version" pilot_wire_climate.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$version" --draft=false --repo "$GITHUB_REPOSITORY"

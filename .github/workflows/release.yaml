name: Release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Release the manifest version unless it already is
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(jq -r .version custom_components/pilot_wire_climate/manifest.json)
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$version is already released"
            exit 0
          fi
          cd custom_components/pilot_wire_climate
          zip -r pilot_wire_climate.zip .
          gh release create "$version" pilot_wire_climate.zip \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$version" --generate-notes
